[project]
name = "mission-control"
version = "0.1.0"
description = "AI employees that answer customers on GitHub from Linear and the docs: a reply waits for a human, and a card closes only when GitHub shows it"
requires-python = ">=3.13"
dependencies = [
    "aiohttp==3.14.4",
    "openai-agents==0.23.1",
    "slack-bolt==1.30.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib -q --strict-markers -m 'not stack'"
markers = [
    "lab(slug): the acceptance test for one Live Lab, named in steps.toml",
    "stack: needs make stack running; make stack-check runs these",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["workforce"]
