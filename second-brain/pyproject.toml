[project]
name = "second-brain"
version = "0.1.0"
description = "Claude Code files a consultant's meeting notes, calls and client decks into one brain an AI employee reads over MCP, and every answer cites a note whose quote is in a file she captured"
requires-python = ">=3.13"
dependencies = [
    "aiohttp==3.14.4",
    "mcp==2.3.0",
    "openai-agents==0.23.1",
    "pypdf==6.21.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The board, its cards and the model come from mission-control, the app every Lightning extends.
pythonpath = [".", "../mission-control"]
addopts = "--import-mode=importlib -q --strict-markers"
markers = ["lab(slug): the acceptance test for one Lightning, named in steps.toml"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["brain", "workforce"]
