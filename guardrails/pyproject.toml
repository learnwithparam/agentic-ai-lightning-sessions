[project]
name = "guardrails"
version = "0.1.0"
description = "A screener shortlists applicants on Acme's board behind two guardrails: a request that screens by age stops before the model, and a CV hiding text from a person is withheld and flagged for a recruiter"
requires-python = ">=3.13"
dependencies = [
    "aiohttp==3.14.4",
    "openai-agents==0.23.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The board, its cards and the model come from mission-control, the app every Lightning extends.
pythonpath = [".", "../mission-control"]
addopts = "--import-mode=importlib -q --strict-markers"
markers = ["lab(slug): the acceptance test for one Lightning, named in steps.toml"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["hiring", "workforce"]
