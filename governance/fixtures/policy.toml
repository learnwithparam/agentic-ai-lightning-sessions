# KaaS Hotels' operating model for its AI employees. The operations director owns this file: which
# employees run, who answers for each, what each may do alone, who signs above that, and what each may
# spend on AI in a month. operating/policy.py reads it before any write reaches a system of record, so a
# change here changes what the agents may do, with no prompt edited.
director = "Marta Berg, operations director"

[agents.rates]
name = "Rate manager"
status = "running"
owner = "Ingrid Dahl, revenue manager"
signer = "Ingrid Dahl, revenue manager"
# A night's price may move this many percent without a signature, and never below the hotel's floor.
change_alone = 15
cap = 0.50
minutes = 20

[agents.supplies]
name = "Supplies buyer"
status = "running"
owner = "Marta Berg, operations director"
signer = "Marta Berg, operations director"
# An order up to this many euros goes out alone, and only to a supplier on this list.
spend_alone = 800
suppliers = ["Nordlin", "Kaffebrenneriet", "Fjordvann"]
cap = 0.50
minutes = 25

[agents.rota]
name = "Rota planner"
status = "running"
owner = "Marta Berg, operations director"
# A change to a published rota is signed by that hotel's manager, named in hotels.toml.
signer = "hotel manager"
rest_hours = 11
cap = 0.50
minutes = 30

[agents.linen]
name = "Linen forecaster"
status = "paused"
owner = "Marta Berg, operations director"
signer = "Marta Berg, operations director"
# It runs in shadow, its forecasts set beside what the hotels used, and orders nothing until they hold.
paused_because = "in shadow until December is checked"
cap = 0.50
minutes = 40
