[project]
name = "multi-agent-mcp"
version = "0.1.0"
description = "A cancelled flight on KaaS Travel's board goes to a trip planner, a booker and a messenger, each scoped by an MCP gateway; the card is Done only when the travel system holds a ticket that lands in time and both contacts were told"
requires-python = ">=3.13"
dependencies = [
    "aiohttp==3.14.4",
    "openai-agents==0.23.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The board, its cards and the model come from mission-control, the app every Lightning extends.
pythonpath = [".", "../mission-control"]
addopts = "--import-mode=importlib -q --strict-markers"
markers = ["lab(slug): the acceptance test for one Lightning, named in steps.toml"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "C90"]
# E501 is off: the formatter wraps code at 88, and prose in strings and docstrings may run on.
ignore = ["S101", "N818", "E501"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.isort]
known-first-party = ["crew", "workforce"]
