[project]
name = "token-economics"
version = "0.1.0"
description = "A claims reader reads accident photos and repair quotes into KaaS Insurance claim files, and three levers cut what each claim costs to read, priced from the provider's own token counts"
requires-python = ">=3.13"
dependencies = [
    "aiohttp==3.14.4",
    "openai-agents==0.23.1",
    "pypdf==6.21.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The board, its cards and the model come from mission-control, the app every Lightning extends.
pythonpath = [".", "../mission-control"]
addopts = "--import-mode=importlib -q --strict-markers"
markers = ["lab(slug): the acceptance test for one Lightning, named in steps.toml"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["claims", "workforce"]
