# Every free Maven Lightning that sells the Agentic AI Buildcamp and its workshops, one folder each.
# A session is `built` when its folder exists, its `make check` passes and its steps.toml marks the
# Lightning's slug as built; scripts/check_sessions.py enforces it. Slugs and titles are Maven's.
#
# Every session reuses Acme's board from mission-control, the project buildcamp learners build, but each
# one puts a different everyday business job on it: never a support desk, refunds or GitHub work twice.
# `job` is the work, `truth` is what decides it worked outside the model, `screen` is the UI the room
# watches, `sells` is the next step.
# The 22 Oct deck led with code and a billing ledger nobody knew, and sold nothing (21 Oct 2026).

[[session]]
date = "2026-10-22"
slug = "build-an-ai-mission-control-app"
title = "Build a Mission Control for AI Agents"
folder = "mission-control"
built = true
job = "AI employees work Acme's GitHub issues; a reply to a customer waits for a human"
truth = "GitHub shows the reply, or the answer cites a source the analyst read"
screen = "The board: Needs you, Approve and post, the receipt, cost per outcome, the team page"
sells = "Buildcamp week 2, where learners build this board"

[[session]]
date = "2026-10-29"
slug = "build-a-team-of-ai-agents"
title = "Build a Multi-Agent System with MCP"
folder = "multi-agent-mcp"
built = true
readable = true
job = "Priya's cancelled flight to a client meeting goes to a trip planner, a booker and a messenger, each scoped by an MCP gateway"
truth = "The travel system holds a ticket that lands in time and both contacts were sent its flight; a fare over the cap waits for her manager"
screen = "The card page with each hand-off, the gateway's call log with its refusals, then the ticket"
sells = "Buildcamp week 3, where the board becomes a system of agents"

[[session]]
date = "2026-11-05"
slug = "add-auth-and-guardrails-to-ai-agents"
title = "Secure AI Agents with Guardrails"
folder = "guardrails"
built = true
readable = true
job = "A recruiting agent shortlists CVs for a role, and one CV hides an instruction to rank its owner first"
