name: check
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref cancels the run it supersedes, so minutes go to the latest tree only.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Branch protection requires this job; .agents/repo.json ci.runner says where it runs (a public repo: GitHub).
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions: read lets the report step fetch the last runs' reports
    permissions:
      contents: read
      actions: read
    steps:
      # Full history, so the security scan can diff this change against the base branch.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: make check
      # Flags      # The stop-stage security checks run here too, so the scanners are installed, never skipped: gitleaks
      # and OSV-Scanner as pinned release binaries checked against their sha256, Semgrep pinned through uv.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/lwp-scanners
          key: scanners-gitleaks-8.30.1-osv-2.6.0
      - name: Install security scanners
        run: |
          d=~/.cache/lwp-scanners
          mkdir -p "$d"
          if [ ! -x "$d/gitleaks" ]; then
            curl -sfLo /tmp/gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
            echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gl.tgz" | sha256sum -c -
            tar -xzf /tmp/gl.tgz -C "$d" gitleaks
          fi
          if [ ! -x "$d/osv-scanner" ]; then
            curl -sfLo /tmp/osv https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
            echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  /tmp/osv" | sha256sum -c -
            install -m 755 /tmp/osv "$d/osv-scanner"
          fi
          echo "$d" >> "$GITHUB_PATH"
          uv tool install semgrep==1.182.0
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Security scan of what this change adds
        run: LWP_SECURITY_BASE=origin/${{ github.base_ref || 'main' }} python3 scripts/lwp/check-security.py gitleaks,semgrep,osv-scanner
 a flaky test from the last runs' reports; mark it quarantine and it moves to the job below.
      - uses: ctrf-io/github-test-reporter@93ff46b55aefe633bde6d13e61a7f533303233e6 # v1.3.2
        if: always()
        with:
          report-path: reports/*.xml
          integrations-config: '{"junit-to-ctrf": {"enabled": true, "action": "convert", "options": {"output": "reports/ctrf.json"}}}'
          summary-report: true
          flaky-rate-report: true
          fail-rate-report: true
          upload-artifact: true
          fetch-previous-results: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # only the tests marked quarantine; it never blocks a push
  quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: make quarantine

  # The deploy promise needs real Keycloak, OpenFGA and Langfuse, so it runs against compose.yaml here.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: make -C mission-control stack-check
      - if: failure()
        run: docker compose -f mission-control/compose.yaml logs --tail 80
